[package]
name = "system_benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
# 引用本地 crates
client = { path = "../client" }
manager = { path = "../manager" }
storager = { path = "../storager" }
common = { path = "../common" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# 数据处理
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI和输出
colored = "2.1"
tabled = "0.16"

# 错误处理
anyhow = "1.0"

# 时间和日期
chrono = "0.4"

# 进程管理
nix = { version = "0.29", features = ["signal", "process"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "system_benchmark"
path = "src/main.rs"
