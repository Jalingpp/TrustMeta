[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manager"
path = "src/main.rs"

[lib]
name = "manager"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
ads_rust = { path = "../storager/ads_lib" }
accumulator_ads = { package = "acctree_accumulator_ads", path = "../storager/ads_lib/src/acctree/accumulator_ads" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { workspace = true }
tonic = { workspace = true }
anyhow = { workspace = true }
csv = "1.3"
ark-serialize = "0.2"
ark-ec = "0.2"
ark-bls12-381 = "0.2"
ark-ff = "0.2"
ark-poly = "0.2"
futures = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde_json = { workspace = true }
