[package]
name = "storager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "storager"
path = "src/main.rs"

[lib]
name = "storager"
path = "src/lib.rs"

[dependencies]
common = { path = "../common" }
ads_rust = { path = "./ads_lib" }
accumulator_tree = { package = "accumulator-tree", path = "./ads_lib/src/acctree" }
acctree_accumulator_ads = { package = "acctree_accumulator_ads", path = "./ads_lib/src/acctree/accumulator_ads" }
tokio = { workspace = true }
tonic = { workspace = true }
anyhow = { workspace = true }
ark-serialize = "0.2"
ark-ec = "0.2"
ark-bls12-381 = "0.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = "0.4"
